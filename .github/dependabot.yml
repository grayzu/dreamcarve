#
# Update PRs for the commit SHAs every workflow pins its actions to (issue #45).
#
# release.yml is generated by dist. A bump there makes the `plan` job fail
# (dist's up-to-date check) until the new SHA is copied into
# dist-workspace.toml `[dist.github-action-commits]` and `dist generate` is
# rerun. Dependabot does not scan .github/build-setup.yml: when it bumps
# taiki-e/install-action in ci.yml, copy the same SHA there and regenerate.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
