#
# Builds a release archive with `dist build` and checks it carries LICENSE,
# NOTICE and THIRD-PARTY-LICENSES (issue #31). A release build is too slow for
# every PR, so this runs only on PRs that change how archives are assembled,
# and on release tags. CI's `third-party licenses` job covers Cargo.lock
# changes on every PR.

name: Release archive

on:
  pull_request:
    paths:
      - dist-workspace.toml
      - about.toml
      - about.hbs
      - NOTICE
      - LICENSE
      - .github/build-setup.yml
      - .github/workflows/release.yml
      - .github/workflows/release-archive.yml
      - tools/third-party-licenses/**
  push:
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'

concurrency:
  group: release-archive-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  archive:
    name: release archive contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      # Same dist version as dist-workspace.toml's `cargo-dist-version`.
      - name: Install dist
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.33.0/cargo-dist-installer.sh | sh"
      - name: Archive contains the license files
        run: cargo test --locked -p third-party-licenses --test ci -- --ignored --exact release_archive_contains_third_party_licenses
