#
# Quality gate for every PR and every push to main (docs/specs/phase-0/design.md, "CI").

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Every job installs the toolchain and components rust-toolchain.toml
      # pins, so a new stable release cannot fail main on its own (issue #151).
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install && rustc --version && cargo clippy --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all
      - name: License headers
        run: cargo run -p check-headers

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses advisories

  third-party-licenses:
    name: third-party licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-about@0.9.2
      # Generates THIRD-PARTY-LICENSES from Cargo.lock and fails when a crate
      # shipped in the dreamcarve binary has no license text (issue #31).
      - name: License texts cover the shipped crates
        run: cargo test --locked -p third-party-licenses --test ci -- --ignored --exact third_party_licenses_cover_lockfile

  # Runs the LinuxCNC and generic programs through LinuxCNC's own
  # interpreter, rs274 (issue #173; tools/gcode-conformance). Its own job:
  # it installs linuxcnc-uspace, which the Ubuntu runners' archives do not
  # have, so it runs in a Debian 12 container with LinuxCNC's official apt
  # repository (tools/gcode-conformance/install-rs274.sh cites it).
  gcode-conformance:
    name: gcode-conformance
    runs-on: ubuntu-latest
    container: debian:bookworm
    timeout-minutes: 30
    steps:
      # The image is minimal: checkout needs git, rustup needs curl, and
      # linking needs a C toolchain.
      - name: Install prerequisites
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends ca-certificates curl git gcc libc6-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install LinuxCNC's rs274
        run: tools/gcode-conformance/install-rs274.sh
      # The toolchain rust-toolchain.toml pins (issue #151).
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install
          "$HOME/.cargo/bin/rustc" --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build dreamcarve
        run: cargo build --locked -p dreamcarve
      - name: Run the programs through rs274
        run: cargo run --locked -p gcode-conformance
      - name: Upload the corpus on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gcode-conformance
          path: target/gcode-conformance
          retention-days: 7

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        shell: bash
        run: rustup toolchain install && rustc --version
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: peaceiris/actions-mdbook@ee69d230fe19748b7abf22df32acaa93833fad08 # v2.0.0
        with:
          mdbook-version: latest
      - name: Build book
        run: mdbook build docs/book
      - name: Build API docs
        run: cargo doc --no-deps --workspace
      - name: Assemble site
        run: |
          mkdir -p site
          cp -r docs/book/book/. site/
          mkdir -p site/api
          cp -r target/doc/. site/api/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  deploy-docs:
    name: deploy docs
    if: github.ref == 'refs/heads/main'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
