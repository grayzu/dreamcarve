[package]
name = "dreamcarve"
description = "DreamCarve: open source CAD/CAM for CNC hobbyists"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "dreamcarve"
path = "src/main.rs"

[dependencies]
clap.workspace = true
dc-cam.workspace = true
dc-gcode.workspace = true
dc-geometry.workspace = true
dc-import.workspace = true
dc-project.workspace = true
# The user config file and directory (`src/config.rs`).
directories.workspace = true
serde.workspace = true
toml.workspace = true

[dev-dependencies]
# Tests re-lay out a .dcv by hand, as a user might (#76), and build phase
# 2 operations from the fixture builders (#117).
dc-project = { workspace = true, features = ["test-support"] }
serde_json.workspace = true

[lints]
workspace = true
