[package]
name = "dreamcarve"
description = "DreamCarve: open source CAD/CAM for CNC hobbyists"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "dreamcarve"
path = "src/main.rs"

[dependencies]
clap.workspace = true
dc-cam.workspace = true
dc-gcode.workspace = true
dc-geometry.workspace = true
dc-import.workspace = true
# The pipeline (`build`, the preview, `init`'s project) and the file I/O
# the app shares (staged writes, the config directory, `config.toml`).
dc-job.workspace = true
dc-library.workspace = true
dc-project.workspace = true
dreamcarve-shell.workspace = true

[dev-dependencies]
# `tests/gui_equality.rs` and `tests/warnings_panel.rs` compare the app's
# output and Warnings panel with the binary's (phase 4 design, "Test
# harness").
dc-app = { workspace = true, features = ["test-support"] }
# Tests re-lay out a .dcv by hand, as a user might (#76), and build phase
# 2 operations from the fixture builders (#117).
dc-project = { workspace = true, features = ["test-support"] }
# `assert_safe` on a generated V-Carve (#404).
dc-cam = { workspace = true, features = ["test-support"] }
serde_json.workspace = true

[lints]
workspace = true
