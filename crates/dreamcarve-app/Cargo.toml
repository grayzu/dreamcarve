[package]
name = "dreamcarve-app"
description = "DreamCarve: the desktop app, a window on the same engine the dreamcarve CLI drives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# In the release archives from v0.4.0-alpha.1: the plain binary for each
# dist target, unsigned, with THIRD-PARTY-LICENSES covering its crates
# (`tools/third-party-licenses`). The release slice (22) still owes the
# signed app bundles and the `.dcv` association, neither of which
# cargo-dist 0.33 makes.

[lib]
name = "dreamcarve_app"
path = "src/lib.rs"

[[bin]]
name = "dreamcarve-app"
path = "src/main.rs"

# `dc-cam` and `dc-gcode` are reached through `dc-job` only (phase 4
# functional spec, S20); `tests/manifest.rs` checks that neither is listed.
[dependencies]
# `--open <path>` and `--version`.
clap.workspace = true
dc-app.workspace = true
dc-geometry.workspace = true
# Import a drawing from the empty state and from a drop.
dc-import.workspace = true
dc-job.workspace = true
# The Tool Library sheet's library (capability 64).
dc-library.workspace = true
dc-project.workspace = true
# The config directory, `gui.toml` and staged writes of the `.dcv`.
dreamcarve-shell.workspace = true
eframe.workspace = true
rfd.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
# `kittest::warnings_copy_reaches_the_clipboard` (#581).
arboard.workspace = true
# `book` writes the book's screenshots, cropped (#550).
png.workspace = true

[lints]
workspace = true
