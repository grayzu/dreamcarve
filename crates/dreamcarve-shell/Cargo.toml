[package]
name = "dreamcarve-shell"
description = "DreamCarve shell I/O shared by the CLI and the app: staged writes, the config directory, config.toml, gui.toml and the tool library file"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# `EstimateConfig`, the `[estimate]` table `config.toml` is read into.
dc-job.workspace = true
# The tool library file, `tools.json`, parsed and written by `dc-library`.
dc-library.workspace = true
dc-project.workspace = true
serde.workspace = true
thiserror.workspace = true
# `gui.toml` is written as well as read, so the writer (`display`) is on
# here; the `dc-*` crates never write a config file.
toml = { workspace = true, features = ["display"] }

[dev-dependencies]
dc-project = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
