[package]
name = "dc-gcode"
description = "DreamCarve post-processors and G-code emission"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# `emit` takes `dc_cam::Toolpath`, the generator's output type
# (`docs/specs/phase-1/design.md`, "dc-gcode"). dc-cam and dc-gcode are
# siblings above dc-project; this edge follows the data flow, and dc-gcode
# uses only the toolpath types, never how a toolpath was generated.
dc-cam.workspace = true
dc-geometry.workspace = true
dc-project.workspace = true
thiserror.workspace = true

[dev-dependencies]
dc-cam = { workspace = true, features = ["test-support"] }
dc-project = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
