[package]
name = "dc-app"
description = "DreamCarve application core: the project history, commands, selection, view, generation bookkeeping, strings, units and preferences the app's shell drives"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
build = "build.rs"

[features]
# Exposes `test_support::Harness` to other crates' tests.
test-support = []

# `dc-cam` and `dc-gcode` are reached through `dc-job` only (phase 4
# functional spec, S20); `tests/manifest.rs` checks that neither is listed.
[dependencies]
dc-geometry.workspace = true
dc-job.workspace = true
# The Import drawing sheet parses the bytes the shell read (capability 55).
dc-import.workspace = true
# The Tool Library window's model: filtering, the import report, project
# copies (capability 64).
dc-library.workspace = true
dc-project.workspace = true
# The generation digest serializes the model records it covers
# (`generation::digest`).
serde.workspace = true
# Routes a typed unit string through `dc_project::units_input`'s
# deserializer, so a field accepts what the file accepts; the digest
# hashes the records' JSON.
serde_json.workspace = true
thiserror.workspace = true

[build-dependencies]
# `build.rs` reads `strings/en.toml` to generate `StrKey`.
toml.workspace = true

[dev-dependencies]
# Cargo unifies features across the package, so the integration tests
# see `test_support` through this dependency on the crate itself.
dc-app = { path = ".", features = ["test-support"] }
dc-project = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
