#
# Every user-visible string of the app (docs/specs/phase-4/design.md,
# "Strings"), keyed `panel.section.item`. `{name}`-style placeholders are
# filled by `Strings::fmt`. build.rs turns each key into a `StrKey` variant,
# `command.label.set_stock` becoming `CommandLabelSetStock`, and the test
# `strings::every_key_is_used` fails on a key no GUI crate uses.
#
# Warning and error text is not here: it is `dc-cam`'s, `dc-project`'s and
# `dc-app`'s `Display`, the CLI's text, until phase 8 keys it.

# What an undo step acts on: one named thing, or a count of them.
[command.subject]
one = "“{name}”"
many = "{count} shapes"

# The undo labels (functional spec, capability 52): the Edit menu shows
# the step it would undo.
[command.label]
set_stock = "Set stock"
set_origin = "Set origin"
set_heights = "Set heights"
set_tolerances = "Set tolerances"
set_display_units = "Set display units"
switch_post = "Switch post-processor to {name}"
set_post_settings = "Set post-processor settings"
add_tool = "Add tool {subject}"
add_tools = "Add {count} tools"
update_tool = "Edit tool {subject}"
remove_tool = "Remove tool {subject}"
import = "Import {name}"
move = "Move {subject}"
rotate = "Rotate {subject}"
scale = "Scale {subject}"
mirror = "Mirror {subject}"
transform = "Transform {subject}"
show = "Show {subject}"
hide = "Hide {subject}"
lock = "Lock {subject}"
unlock = "Unlock {subject}"
set_flags = "Set flags of {subject}"
rename = "Rename {subject}"
duplicate = "Duplicate {subject}"
delete = "Delete {subject}"
add_operation = "Add {subject}"
set_field = "Set {field} of {subject}"
edit_operation = "Edit {subject}"
reorder_operations = "Reorder operations"
enable = "Enable {subject}"
disable = "Disable {subject}"
place_tab = "Place 1 tab"
place_tabs = "Place {count} tabs"
add_tab = "Add tab"
move_tab = "Move tab"
update_tab = "Edit tab"
delete_tab = "Delete tab"
delete_tabs = "Delete {count} tabs"
centre_on_stock = "Centre {subject} on stock"
fit_stock = "Fit stock to shapes"

# The Project panel (slice 7, #536; functional spec, capabilities 60 and
# 62; mock-up 03): what the Properties area shows with nothing selected.
# Each field has a label and a one-sentence `_help`, shown on the label's
# hover above the `.dcv` field it writes (`experience.md`, section 7).
[project]
title = "Project · {name}"

[project.stock]
title = "Stock"
width = "Width"
width_help = "How wide the stock is, along X."
height = "Height"
height_help = "How deep the stock is, along Y."
thickness = "Thickness"
thickness_help = "How thick the material is; measure it. Export refuses until it is set."
margin = "Margin"
margin_help = "How far the stock reaches past the visible shapes on every side when it is fitted to them."
fit = "Fit to shapes"

[project.origin]
title = "Origin"
xy = "XY zero"
xy_help = "Where the machine's X0 Y0 sits on the stock."
bottom_left = "Bottom-left"
bottom_right = "Bottom-right"
top_left = "Top-left"
top_right = "Top-right"
centre = "Centre"
custom = "Custom"
x = "X"
x_help = "The work zero's X, from the stock's bottom-left corner."
y = "Y"
y_help = "The work zero's Y, from the stock's bottom-left corner."
z = "Z zero"
z_help = "Whether Z0 is the top or the bottom face of the stock."
top = "Top"
bottom = "Bottom"

[project.heights]
title = "Heights"
clearance = "Clearance"
clearance_help = "Height above the stock top for moves between parts, between operations, at a tool change and at the end. Empty keeps each operation's safe Z."
tool_change_z = "Tool-change machine Z"
tool_change_z_help = "The machine Z that G53 lifts to at each tool change and at the end of every program; needs a homed machine."
park = "Park point"
park_help = "Where the program ends in XY, typed as X, Y. Empty ends where the last cut ends."
pick = "Click on the view"
picking = "Click the Viewport to set the park point. Esc cancels."

[project.tolerances]
title = "Tolerances"
flatten = "Flatten"
flatten_help = "How far a flattened curve may stray from the true curve."
arc_fit = "Arc fitting"
arc_fit_help = "How far a fitted arc may stray from the lines it replaces. Off writes lines only."

[project.post]
title = "Post-processor"
controller = "Controller"
controller_help = "The bundled post-processor that writes G-code for your controller."
version = "{name} v{version}"
version_latest = "{name} v{version} (latest)"
older = "This project uses v{version}; v{latest} is the latest. Pick it to upgrade."
keeps = "Switching keeps the settings the new one can use."
reset = "Reset {setting} {from} → {to}: post-processor {post} {why}."
reset_no_m6 = "has no M6 tool change"
reset_no_cycles = "has no canned cycles"
extension = "File extension"
extension_help = "The extension of the G-code files export writes."
spindle = "Spindle control"
spindle_help = "Automatic switches the spindle from the program; Manual pauses for you to switch the router."
automatic = "Automatic"
manual = "Manual"
dwell = "Spin-up dwell"
dwell_help = "Seconds to wait after the spindle starts, so it reaches speed before it cuts."
tool_change = "Tool change"
tool_change_help = "One program per tool, or one program that stops with M6 at each change."
separate = "One program per tool"
m6 = "One program with M6"
decimals_mm = "Decimals, mm"
decimals_mm_help = "Decimal places the program writes in millimetres."
decimals_inch = "Decimals, inch"
decimals_inch_help = "Decimal places the program writes in inches."
canned = "Canned drill cycles"
canned_help = "Write Drill operations as the controller's canned cycles."
no_canned = "Not offered: {name} has no canned cycles."

