# The project's settings (slice 7, #536; slice 23, #615; functional spec,
# capabilities 53, 60 and 62; mock-up 03): the Stock step's fields and the
# Export step's output settings. Each field has a label and a one-sentence
# `_help`, shown on the label's hover above the `.dcv` field it writes
# (`experience.md`, section 7).
[project]
units = "Units"
units_help = "The units every length and feed is shown and typed in. The file stores millimetres either way."
units_mm = "mm"
units_in = "in"
# Between the parts of a closed group's one-line summary.
summary_separator = " · "

[project.stock]
width = "Width"
width_help = "How wide the stock is, along X: above 0 and at most 6000 mm (236 in)."
height = "Height"
height_help = "How deep the stock is, along Y, front to back: above 0 and at most 6000 mm (236 in)."
thickness = "Thickness"
thickness_help = "How thick the material is: above 0 and at most 6000 mm (236 in). Measure it; every depth is checked against it. Empty is not set, and export refuses until it is."
margin = "Margin"
margin_help = "How far the stock reaches past the visible shapes on every side when Fit to shapes sizes it: a length, 0 or more. It is not saved with the project."
fit = "Fit to shapes"

[project.origin]
title = "Origin"
xy = "XY zero"
xy_help = "Where the machine's X0 Y0 sits on the stock: one of its four corners, its centre, or Custom, a point you type. It moves the program's coordinates, not the shapes."
bottom_left = "Bottom-left"
bottom_right = "Bottom-right"
top_left = "Top-left"
top_right = "Top-right"
centre = "Centre"
custom = "Custom"
x = "X"
x_help = "The work zero's X, measured from the stock's bottom-left corner: from -6000 to 6000 mm (236 in)."
y = "Y"
y_help = "The work zero's Y, measured from the stock's bottom-left corner: from -6000 to 6000 mm (236 in)."
z = "Z zero"
z_help = "Whether Z0 is the top face of the stock or its bottom face, the spoilboard. Zero the bit on the same face at the machine."
top = "Top"
bottom = "Bottom"

[project.heights]
title = "Heights"
clearance = "Clearance"
clearance_help = "The height above the stock top for moves between parts, between operations, at a tool change and at the end: above 0, and at least every operation's Safe Z. Empty keeps each operation's own Safe Z."
tool_change_z = "Tool-change machine Z"
tool_change_z_help = "The height in machine coordinates the bit lifts to at each tool change and at the end of every program: below 0, since machine Z is 0 at the top of travel and counts down. It needs a homed machine. Empty lifts to the Clearance instead."
park = "Park point"
park_help = "Where the bit goes in X and Y when the program ends, typed as X, Y in the project's units, each from -6000 to 6000 mm (236 in), or clicked on the view. Empty ends where the last cut ends."
pick = "Click on the view"
picking = "Click the Viewport to set the park point. Esc cancels."
# The group's header while it is closed, on the Export step.
summary_clearance = "Clearance {clearance} {unit}"
summary_safe_z = "Each operation's safe Z"
summary_park = "park {park}"

[project.tolerances]
title = "Tolerances"
summary_flatten = "Flatten {flatten} {unit}"
summary_arcs = "arcs {arc} {unit}"
summary_lines = "lines only"
flatten = "Flatten"
flatten_help = "How far the straight pieces a curve is cut into may stray from the true curve: above 0 and at most 0.1 mm (0.0039 in). Smaller is smoother and makes longer programs."
arc_fit = "Arc fitting"
arc_fit_help = "How far an arc the program writes may stray from the straight moves it replaces: above 0. Off writes straight moves only, for a controller that handles arcs badly."

[project.post]
title = "Post-processor"
summary = "{post} · .{extension}"
controller = "Controller"
controller_help = "The post-processor that writes G-code for your controller, one of the six bundled with DreamCarve. Switching keeps the settings the new one can use and says which it reset."
version = "{name} v{version}"
version_latest = "{name} v{version} (latest)"
older = "This project uses v{version}; v{latest} is the latest. Pick it to upgrade."
keeps = "Switching keeps the settings the new one can use."
reset = "Reset {setting} {from} → {to}: post-processor {post} {why}."
reset_no_m6 = "has no M6 tool change"
reset_no_cycles = "has no canned cycles"
extension = "File extension"
extension_help = "The ending of the G-code files export writes, with or without its dot: 1 to 8 letters or digits, and never dcv, which is the project's own."
spindle = "Spindle control"
spindle_help = "Automatic: the program starts and stops the spindle at each tool's RPM. Manual: the program pauses for you to switch the router on and off by hand."
automatic = "Automatic"
manual = "Manual"
dwell = "Spin-up dwell"
dwell_help = "How many seconds the program waits after the spindle starts, so it is up to speed before it cuts: 0 or more; 0 is no wait."
# How a project with several tools is written (capability 77): the one
# control for it, on the Export step. The names are plain; what the
# program contains is the help's to say.
tool_change = "Programs"
tool_change_help = "How a project that cuts with several tools is written. One program per tool: a file for each tool, run one after another, each zeroed with its own bit. One program for all tools: one file that stops at each tool change for you to fit the next bit and set Z zero; offered only where the controller's post-processor has a tool-change stop (M6). The choice is saved with the project."
separate = "One program per tool"
m6 = "One program for all tools"
decimals_mm = "Decimals, mm"
decimals_mm_help = "How many decimal places the program writes for a millimetre: a whole number from 0 to 255; 3 is usual."
decimals_inch = "Decimals, inch"
decimals_inch_help = "How many decimal places the program writes for an inch: a whole number from 0 to 255; 4 is usual."
canned = "Canned drill cycles"
canned_help = "Write Drill operations as the controller's canned cycles."
no_canned = "Not offered: {name} has no canned cycles."

