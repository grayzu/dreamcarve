<!-- The quick-start coaster (fixtures/coaster.svg) drawn as four cubic
     Béziers with handles 0.55 × r, as some editors save a circle. That is
     not the circle's exact arc (handles 0.5523 × r), so DreamCarve flattens
     it to short straight edges, the curves arc fitting works on (#70). -->
<svg xmlns="http://www.w3.org/2000/svg" width="100mm" height="100mm" viewBox="0 0 100 100">
  <path id="coaster" d="M 95,50 C 95,74.75 74.75,95 50,95 C 25.25,95 5,74.75 5,50 C 5,25.25 25.25,5 50,5 C 74.75,5 95,25.25 95,50 Z" fill="none" stroke="#000000" stroke-width="0.2"/>
</svg>
