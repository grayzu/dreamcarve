<?xml version="1.0" encoding="UTF-8"?>
<!-- DreamCarve phase 2 test part (docs/specs/phase-2/functional.md, "Test part"):
     a 150 × 100 mm plaque. The twin of plaque.dxf: same shapes, same names,
     same order. SVG is Y-down, so y here is 100 minus the DXF y. Each outline
     starts at the same point and runs the same way in both (clockwise, from
     the top-left), because where a cut starts and which way an Engrave runs
     follow the drawing: the two export the same programs (#125). -->
<svg xmlns="http://www.w3.org/2000/svg" width="150mm" height="100mm" viewBox="0 0 150 100">
  <g fill="none" stroke="#000000" stroke-width="0.2">
    <rect id="outline" x="0" y="0" width="150" height="100" rx="10" ry="10"/>
    <rect id="pocket" x="25" y="8" width="100" height="50" rx="5" ry="5"/>
    <circle id="island" cx="75" cy="33" r="10"/>
    <rect id="square" x="60" y="62" width="30" height="30"/>
    <circle id="holes-1" cx="17" cy="83" r="2.5"/>
    <circle id="holes-2" cx="133" cy="83" r="2.5"/>
    <circle id="holes-3" cx="133" cy="17" r="2.5"/>
    <circle id="holes-4" cx="17" cy="17" r="2.5"/>
    <rect id="border" x="5" y="5" width="140" height="90" rx="5" ry="5"/>
    <path id="squiggle" d="M 95,88 C 105,65 120,100 130,75"/>
  </g>
</svg>
