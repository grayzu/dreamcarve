#
# cargo-deny configuration. Allowed licenses follow docs/rust-guidelines.md,
# "Dependencies". CI runs `cargo deny check licenses advisories`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "ISC",
    "Unicode-3.0",
]
# MPL-2.0 is allowed only per crate, with a comment, after review.
exceptions = [
    # `option-ext` comes with `directories` (via `dirs-sys`), the config
    # directory lookup in the `dreamcarve` binary. MPL-2.0 is a file-level
    # copyleft: it covers that crate's own source files, which are used
    # unmodified and stay available from crates.io; no DreamCarve file is
    # affected. Listed in NOTICE.
    { crate = "option-ext", allow = ["MPL-2.0"] },
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
