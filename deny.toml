#
# cargo-deny configuration. Allowed licenses follow docs/rust-guidelines.md,
# "Dependencies". CI runs `cargo deny check licenses advisories`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    # The app's accessibility tree on Linux (eframe's `accesskit`, which the
    # window tests drive; #532) reaches D-Bus through `zbus` 5, whose name
    # and variant crates were folded into `zbus` 6 and marked unmaintained.
    # Notices, not vulnerabilities; no release of `accesskit_unix` uses
    # `zbus` 6 yet. Drop these when one does.
    { id = "RUSTSEC-2026-0370", reason = "zvariant: merged into zbus 6; accesskit_unix still on zbus 5" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: merged into zbus 6; accesskit_unix still on zbus 5" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: merged into zbus 6; accesskit_unix still on zbus 5" },
]

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "ISC",
    "Unicode-3.0",
]
# MPL-2.0 is allowed only per crate, with a comment, after review.
exceptions = [
    # BSL-1.0, for these two crates only and never in `allow` (#581): the
    # app's clipboard, eframe `clipboard` -> egui-winit `clipboard` ->
    # arboard (MIT OR Apache-2.0) -> clipboard-win -> error-code, Windows
    # only. Any other BSL-1.0 crate still needs review.
    { crate = "clipboard-win", allow = ["BSL-1.0"] },
    { crate = "error-code", allow = ["BSL-1.0"] },
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
