<text x="930" y="492" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#7a7a7a" text-anchor="start">Place tabs on a Profile turns its request into placed tabs.</text>
<text x="930" y="510" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#7a7a7a" text-anchor="start">Every enabled Profile cutting the outline rises over the tab.</text>
<text x="930" y="528" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#7a7a7a" text-anchor="start">A disabled Profile keeps its request until it is placed.</text>
<text x="930" y="546" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#7a7a7a" text-anchor="start">Deleting an instance deletes its tabs; deleting an operation does not.</text>
<text x="930" y="564" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#7a7a7a" text-anchor="start">The saved file holds placed tabs only, as tabs place leaves it.</text>
