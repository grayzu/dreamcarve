<svg xmlns="http://www.w3.org/2000/svg" width="720" height="540" viewBox="0 0 720 540" font-family="Helvetica, Arial, sans-serif">
<title>DreamCarve phase 4 wireframe: import dialog</title>
<rect width="720" height="540" fill="#ffffff"/>
<rect x="0" y="0" width="720" height="22" rx="0" fill="#fff8e1" stroke="none" stroke-width="1"/>
<text x="8" y="15" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#7a7a7a" text-anchor="start" font-style="italic">02 · Import a drawing (capability 55). DXF shown; an SVG has no options.</text>
<rect x="20" y="40" width="680" height="480" rx="0" fill="#f4f4f4" stroke="#9a9a9a" stroke-width="1"/>
<rect x="20" y="40" width="680" height="24" rx="0" fill="#e6e6e6" stroke="#9a9a9a" stroke-width="1"/>
<text x="28" y="56" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#2b2b2b" text-anchor="start">Import drawing</text>
<text x="680" y="57" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#7a7a7a" text-anchor="end">✕</text>
<text x="36" y="90" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#2b2b2b" text-anchor="start">File</text>
<rect x="36" y="98" width="540" height="22" rx="2" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/>
<text x="42" y="113" font-family="Menlo, Consolas, monospace" font-size="11" font-weight="normal" fill="#2b2b2b" text-anchor="start">/Users/sam/cnc/plaque.dxf</text>
<rect x="584" y="97" width="100" height="24" rx="3" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/>
<text x="634.0" y="113.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b2b2b" text-anchor="middle">Choose…</text>
<text x="36" y="146" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#7a7a7a" text-anchor="start">DXF · 14 closed shapes, 1 open path, 3 layers · units from the file: mm</text>
<text x="36" y="176" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#2b2b2b" text-anchor="start">Options</text>
<text x="36" y="200" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b2b2b" text-anchor="start">Units</text>
<rect x="174" y="186" width="182" height="20" rx="2" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/>
<text x="180" y="200" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b2b2b" text-anchor="start">Millimetres (from the file)</text>
<text x="348" y="200" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#7a7a7a" text-anchor="end">▾</text>
<text x="36" y="226" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b2b2b" text-anchor="start">Join tolerance</text>
<rect x="174" y="212" width="182" height="20" rx="2" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/>
<text x="180" y="226" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b2b2b" text-anchor="start">0.01</text>
<text x="350" y="226" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#7a7a7a" text-anchor="end">mm</text>
<text x="36" y="242" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#7a7a7a" text-anchor="start" font-style="italic">Units are required when the file declares none ($INSUNITS).</text>
<text x="36" y="270" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#2b2b2b" text-anchor="start">Layers</text>
<rect x="36" y="280" width="320" height="90" rx="0" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/>
