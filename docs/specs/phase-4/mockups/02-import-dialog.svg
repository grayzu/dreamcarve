<rect x="44" y="332" width="12" height="12" rx="2" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/>
<path d="M46 338 l3 3 l5 -6" fill="none" stroke="#2b2b2b" stroke-width="1.5"/>
<text x="62" y="343" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b2b2b" text-anchor="start">DRILL · 4 circles</text>
<rect x="44" y="354" width="12" height="12" rx="2" fill="#e6e6e6" stroke="#9a9a9a" stroke-width="1"/>
<text x="62" y="365" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#7a7a7a" text-anchor="start">NOTES · 2 TEXT (not read)</text>
<rect x="380" y="196" width="300" height="190" rx="0" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/>
<text x="386" y="210" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#7a7a7a" text-anchor="start">Preview</text>
<rect x="400" y="230" width="260" height="130" rx="8" fill="none" stroke="#2b2b2b" stroke-width="1"/>
<rect x="440" y="250" width="120" height="80" rx="0" fill="none" stroke="#2b2b2b" stroke-width="1"/>
<circle cx="500" cy="290" r="18" fill="none" stroke="#2b2b2b" stroke-width="1"/>
<circle cx="415" cy="245" r="5" fill="none" stroke="#2b2b2b" stroke-width="1"/>
<circle cx="645" cy="245" r="5" fill="none" stroke="#2b2b2b" stroke-width="1"/>
<circle cx="415" cy="345" r="5" fill="none" stroke="#2b2b2b" stroke-width="1"/>
<circle cx="645" cy="345" r="5" fill="none" stroke="#2b2b2b" stroke-width="1"/>
<path d="M590 320 q20 -60 50 -30" fill="none" stroke="#2b2b2b" stroke-width="1" stroke-dasharray="3 2"/>
<text x="36" y="410" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#7a7a7a" text-anchor="start" font-style="italic">Shapes are placed as drawn, the drawing's origin at the stock's bottom-left, and selected after import.</text>
<text x="36" y="426" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="normal" fill="#b26a00" text-anchor="start">Warnings: 2 TEXT entities are not read and will be listed in the Warnings panel.</text>
<rect x="500" y="480" width="80" height="26" rx="3" fill="#ffffff" stroke="#9a9a9a" stroke-width="1"/>
<text x="540.0" y="497.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#2b2b2b" text-anchor="middle">Cancel</text>
<rect x="590" y="480" width="94" height="26" rx="3" fill="#2f6fdb" stroke="#2f6fdb" stroke-width="1"/>
<text x="637.0" y="497.0" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="normal" fill="#ffffff" text-anchor="middle">Import</text>
</svg>
