[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# Extra files copied into the root of every archive. LICENSE is auto-included.
# THIRD-PARTY-LICENSES is generated before `dist build` by the steps in
# .github/build-setup.yml (`cargo run -p third-party-licenses -- generate`).
include = ["NOTICE", "THIRD-PARTY-LICENSES"]
# Steps run before `dist build` on every build runner.
github-build-setup = "../build-setup.yml"
# Pin the actions dist writes into release.yml to full commit SHAs (issue #45).
# Each SHA was resolved from the official repository's tag named in the
# comment. Dependabot does not edit this file: when it bumps an action in
# release.yml, update the SHA here and run `dist generate`.
[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
