[workspace]
resolver = "3"
members = [
    "crates/dc-geometry",
    "crates/dc-project",
    "crates/dc-cam",
    "crates/dc-gcode",
    "crates/dc-import",
    "crates/dc-library",
    "crates/dc-job",
    "crates/dc-app",
    "crates/dreamcarve-shell",
    "crates/dreamcarve",
    "crates/dreamcarve-app",
    "tools/check-headers",
    "tools/doc-figures",
    "tools/gcode-conformance",
    "tools/grbl-sim-motion",
    "tools/linuxcnc-sim",
    "tools/rs274-motion",
    "tools/third-party-licenses",
]

[workspace.package]
version = "0.2.1"
edition = "2024"
# The minimum supported Rust version, not the toolchain the gates run on.
# rust-toolchain.toml pins that newer lint toolchain (issue #151); the MSRV
# stays lower so a build from source works on an older stable.
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/grayzu/dreamcarve"
authors = ["The DreamCarve Contributors"]

[workspace.dependencies]
# Internal crates
dc-geometry = { path = "crates/dc-geometry", version = "0.2.1" }
dc-project = { path = "crates/dc-project", version = "0.2.1" }
dc-cam = { path = "crates/dc-cam", version = "0.2.1" }
dc-gcode = { path = "crates/dc-gcode", version = "0.2.1" }
dc-import = { path = "crates/dc-import", version = "0.2.1" }
dc-library = { path = "crates/dc-library", version = "0.2.1" }
dc-job = { path = "crates/dc-job", version = "0.2.1" }
dc-app = { path = "crates/dc-app", version = "0.2.1" }
dreamcarve-shell = { path = "crates/dreamcarve-shell", version = "0.2.1" }

# External crates. Versions are set here once; crates use `workspace = true`.
serde = { version = "1.0", features = ["derive"] }
# `float_roundtrip`: parse floats exactly, so a saved .dcv loads back
# bit-identical (acceptance test 1); the default parser can be off by 1 ulp.
serde_json = { version = "1.0", features = ["preserve_order", "float_roundtrip"] }
thiserror = "2.0"
# Names the JSON path of a .dcv schema error (#65), which serde_json loses
# once a migrated file is deserialized from a `Value`.
serde_path_to_error = "0.1"
clap = { version = "4.6", features = ["derive", "cargo"] }
kurbo = "0.13"
cavalier_contours = "0.9"
# Polygon booleans for pockets (phase 2 design, "Algorithms → Pocket").
# Default features are off: they pull in a glam/serde bridge and f32
# geometry types that nothing here uses.
i_overlay = { version = "9.1", default-features = false }
# Delaunay triangulation for the medial axis (phase 3 design, "Algorithms →
# Medial axis"): the Rust port of the `delaunator` PureCutCNC triangulates
# with, so the axis is built as upstream builds it. ISC; one dependency,
# `robust` (Apache-2.0 OR MIT), the exact predicates that keep it
# deterministic across platforms. Default features are off and `std` back
# on: without it the crate uses its own sqrt and floor approximations.
delaunator = { version = "1.1", default-features = false, features = ["std"] }
# SVG parsing. Must stay >= 0.45: earlier releases are MPL-2.0. Default
# features are off: they add text shaping, system font loading (file I/O),
# svgz, and the writer, none of which an importer needs.
usvg = { version = "0.48", default-features = false }
# `config.toml` parsing (phase 2 design, "User config (CLI only)"). Default
# features are off: `parse` and `serde` deserialize the file into a struct;
# `dreamcarve-shell` adds `display` (the writer) for `gui.toml` alone.
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
# Unzips Fusion 360 `.tools` libraries (phase 2 design, "Fusion import").
# Default features are off: they add encryption, timestamps and five more
# codecs. Fusion writes deflate, so only the deflate decoder is on, through
# flate2's pure-Rust zlib-rs backend.
zip = { version = "9.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Property tests (dev-dependency only, issue #72; `docs/rust-guidelines.md`,
# "Tests"). Default features are off: `fork` and `timeout` run each case in
# a child process (rusty-fork, tempfile), and `bit-set` serves collection
# strategies nothing here uses. `std` keeps the regression files under
# `proptest-regressions/`.
proptest = { version = "1.12", default-features = false, features = ["std"] }

# The app's window (phase 4 design, "The shell"; open question 1). Default
# features are off: they bundle egui's own fonts (the app ships Inter,
# JetBrains Mono and Lucide), system fonts and the glow renderer. `wgpu` is
# the renderer the Viewport's line pass needs (slice 4); `accesskit` is the
# accessibility tree the kittest tests drive; `links`, `x11` and `wayland`
# are what a desktop window needs on each platform. `clipboard` stays off
# until a slice copies text (#532): its `arboard` brings two BSL-1.0 crates
# on Windows, which `deny.toml` does not allow.
eframe = { version = "0.37", default-features = false, features = ["accesskit", "links", "wayland", "wgpu", "x11"] }
# Native open and save dialogs (phase 4 design, open question 3).
rfd = "0.17"
# The app's window tests (dev-dependency only; phase 4 design, "Test
# harness"): egui's harness, driven through the accessibility tree, with the
# wgpu renderer for the smoke test's one frame.
egui_kittest = { version = "0.37", features = ["eframe", "snapshot", "wgpu"] }

# Lints shared by every crate (`docs/rust-guidelines.md`, "Toolchain and
# workspace"). Tests and the `dreamcarve` binary relax the unwrap/expect/panic
# lints at module level with a one-line reason; `clippy.toml` already allows
# them inside `#[cfg(test)]`.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
cast_possible_truncation = "warn"
float_cmp = "deny"

# cavalier_contours 0.9.0 is built without its debug assertions in debug
# builds (#384), as in release. Its offset can hand one dissected slice an
# end point on the segment after the one it names, a few µm off, and its
# view check asserts on that (`pline_view.rs:353`), though the offset it
# returns is right. Only checks hang on `debug_assertions` there, so debug
# and release results are the same. Remove once upstream fixes it; the
# regression tests are dc-geometry's `offset_of_a_loop_with_sub_micron_*`
# and the properties case `dogbone_pocket_round_a_rotated_rect_island_*`.
[profile.dev.package.cavalier_contours]
debug-assertions = false

# Tests are built optimised. The geometry and toolpath tests are mostly
# arithmetic, and unoptimised they ran about 45 minutes per CI job; the
# dc-gcode property tests take 76 s unoptimised and 11 s here. Debug
# assertions and overflow checks stay on, inherited from dev, and so does
# the cavalier_contours override above. Rust does not reorder or fuse
# floating-point operations, so results are the same at any opt-level.
# `cargo build` and clippy keep the unoptimised dev profile.
[profile.test]
opt-level = 2

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
